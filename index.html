<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }

  body {
    background:
      radial-gradient(circle at 85% 18%, #ffd93b 0 40px, transparent 41px),
      repeating-linear-gradient(90deg, #fff 0 40px, transparent 40px 80px) left 0 bottom 42px / 100% 6px no-repeat,
      linear-gradient(#555, #555) left 0 bottom 0 / 100% 90px no-repeat,
      linear-gradient(#5cb85c, #5cb85c) left 0 bottom 90px / 100% 60px no-repeat,
      linear-gradient(#8fd3ff, #e8f7ff);
  }

  body::before {
    content: "";
    position: fixed;
    left: 15%;
    bottom: 90px;
    width: 70px;
    height: 130px;
    background:
      radial-gradient(circle at 50% 35px, #2e7d32 0 35px, transparent 36px),
      linear-gradient(#6d4c41, #6d4c41) 50% 100% / 12px 70px no-repeat;
  }

  .car {
    position: absolute;
    left: 0;
    bottom: 64px;
    width: 200px;
    height: 46px;
    background: radial-gradient(circle at 192px 14px, #ffe066 0 5px, transparent 6px), #e53935;
    border-radius: 12px 16px 6px 6px;
    transform: translateX(-200px);
    animation: drive 4s ease-out forwards;
  }

  .car::before {
    content: "";
    position: absolute;
    left: 40px;
    top: -34px;
    width: 110px;
    height: 34px;
    background:
      linear-gradient(#bfe9ff, #bfe9ff) 8px 8px / 42px 22px no-repeat,
      linear-gradient(#bfe9ff, #bfe9ff) 58px 8px / 42px 22px no-repeat,
      #e53935;
    border-radius: 20px 30px 0 0;
  }

  .car::after {
    content: "";
    position: absolute;
    left: 25px;
    bottom: -16px;
    width: 36px;
    height: 36px;
    background: #222;
    border-radius: 50%;
    box-shadow: 110px 0 #222;
  }

  @keyframes drive {
    to { transform: translateX(calc(100vw - 250px)); }
  }
</style>
</head>
<body>
  <div class="car"></div>
</body>
</html>
